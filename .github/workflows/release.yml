name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (optional, defaults to v<package.json.version>, e.g. v1.1.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-release-qc:
    name: Fast Pre-Release Gate (Cost Guard)
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Resolve Release Tag
        id: resolve_tag
        shell: bash
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck Verification
        run: npm run typecheck

      - name: Production Bundle Verification
        run: npm run build

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo Clippy Linter
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Volumetric & Parser Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

  release:
    name: Build Installer (${{ matrix.platform }})
    needs: [pre-release-qc]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
            targets: ''
          - platform: 'windows-11-arm'
            args: '--target aarch64-pc-windows-msvc --bundles nsis'
            targets: 'aarch64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            args: ''
            targets: ''
          - platform: 'ubuntu-24.04-arm'
            args: ''
            targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            xdg-utils

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tagName: ${{ needs.pre-release-qc.outputs.release_tag }}
          releaseName: 'Wildcat Studio ${{ needs.pre-release-qc.outputs.release_tag }}'
          releaseBody: 'See release assets below for macOS (Universal - Intel & Apple Silicon), Windows (x64 & ARM64), and Linux (x64 & ARM64).'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  generate-checksums:
    name: Generate Updater Manifest & SHA256 Checksums
    needs: [pre-release-qc, release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download Release Assets, Build latest.json & Compute SHA256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.pre-release-qc.outputs.release_tag }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG_NAME" --dir release-assets
          rm -f release-assets/latest.json release-assets/SHA256SUMS.txt
          VER="${TAG_NAME#v}"
          awk -v ver="$VER" '$0 ~ "^## \\[?" ver "(\\]|$| )"{p=1; next} /^## /{if(p) exit} p' CHANGELOG.md > release_notes.txt || true
          if [ -z "$(tr -d '[:space:]' < release_notes.txt 2>/dev/null)" ]; then
            echo "Standalone multi-platform installers for macOS (Universal), Windows (x64 & ARM64), and Linux (x64 & ARM64)." > release_notes.txt
          fi
          node scripts/generate-updater-manifest.mjs release-assets "${{ github.repository }}" "$TAG_NAME" release_notes.txt latest.json
          (
            cd release-assets
            if compgen -G "*.*" > /dev/null; then
              sha256sum * > ../SHA256SUMS.txt
            fi
          )
          if [ -s SHA256SUMS.txt ]; then
            gh release upload "$TAG_NAME" latest.json SHA256SUMS.txt --clobber
            gh release edit "$TAG_NAME" --notes-file release_notes.txt
            echo "latest.json and SHA256SUMS.txt generated and attached to release."
          fi

  notify-store:
    name: Notify ArmsTrader Store
    needs: [pre-release-qc, generate-checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ArmsTrader Store Direct Sync
        env:
          ARMSTRADER_WEBHOOK_KEY: ${{ secrets[format('{0}', 'ARMSTRADER_WEBHOOK_KEY')] }}
          ADMIN_API_KEY: ${{ secrets[format('{0}', 'ADMIN_API_KEY')] }}
          ARMSTRADER_DISPATCH_TOKEN: ${{ secrets[format('{0}', 'ARMSTRADER_DISPATCH_TOKEN')] }}
          TAG_NAME: ${{ needs.pre-release-qc.outputs.release_tag }}
        run: |
          echo "Wildcat Studio release successfully published to GitHub."
          KEY="${ARMSTRADER_WEBHOOK_KEY:-$ADMIN_API_KEY}"
          if [ -n "$KEY" ]; then
            echo "Notifying ArmsTrader Store direct VPS webhook endpoint..."
            curl -s -X POST \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              https://armstrader.store/api/admin/sync-downloads \
              -d "{\"app\": \"wildcat-studio\"}" || true
          elif [ -n "$ARMSTRADER_DISPATCH_TOKEN" ]; then
            echo "Dispatching release sync to cook0001/armstrader.store..."
            curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $ARMSTRADER_DISPATCH_TOKEN" \
              https://api.github.com/repos/cook0001/armstrader.store/dispatches \
              -d "{\"event_type\": \"app_released\", \"client_payload\": {\"app\": \"wildcat-studio\", \"version\": \"$TAG_NAME\"}}" || true
          else
            echo "Notice: Direct webhook keys not configured in repository secrets."
            echo "ArmsTrader Store autonomous background sync engine will detect and stream these new binaries to the server."
          fi

